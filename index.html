<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Financial Helper - Supabase</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h2>🌤️ Financial Helper</h2>

    <p class="subtitle">
        เครื่องมือคำนวณและวางแผนเป้าหมายเงินออม
    </p>

    <!-- ================= FORM ================= -->

    <div class="form-group">

        <label for="income">
            💵 รายได้ต่อเดือน (บาท)
        </label>

        <input
            type="number"
            id="income"
            placeholder="กรอกรายได้ เช่น 25000"
        >

    </div>


    <div class="form-group">

        <label for="expense">
            🛍️ รายจ่ายต่อเดือน (บาท)
        </label>

        <input
            type="number"
            id="expense"
            placeholder="กรอกรายจ่าย เช่น 12000"
        >

    </div>


    <div class="form-group">

        <label for="goal">
            🎯 เป้าหมายเงินเก็บ (บาท)
        </label>

        <input
            type="number"
            id="goal"
            placeholder="กรอกเป้าหมาย เช่น 50000"
        >

    </div>


    <div class="form-group">

        <label for="months">
            📅 ระยะเวลาที่ต้องการเก็บ (เดือน)
        </label>

        <input
            type="number"
            id="months"
            placeholder="กรอกจำนวนเดือน เช่น 6"
            min="1"
        >

    </div>


    <!-- ================= BUTTON ================= -->

    <div class="button-group">

        <button
            id="calcBtn"
            class="btn btn-calc"
        >
            ✨ คำนวณผล
        </button>


        <button
            id="saveBtn"
            class="btn btn-save"
        >
            💾 บันทึกข้อมูล
        </button>

    </div>


    <!-- ================= RESULT ================= -->

    <div
        id="resultBox"
        class="result-box hide-box"
    >

        <h3>
            📊 สรุปผลการประเมิน
        </h3>

        <p id="savingsPerMonth">
            ต้องออมต่อเดือน: - บาท
        </p>

        <p
            id="savingsPerDay"
            class="highlight"
        >
            ต้องออมต่อวัน: - บาท
        </p>

        <p id="statusMessage">
            สถานะเป้าหมาย: -
        </p>

    </div>


    <!-- ================= DATABASE DATA ================= -->

    <div class="history-section">

        <div class="history-header">

            <h3>
                📋 ประวัติแผนการเงิน
            </h3>

            <button
                id="refreshBtn"
                class="refresh-btn"
            >
                🔄 รีเฟรช
            </button>

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>รายได้</th>
                        <th>รายจ่าย</th>
                        <th>เป้าหมาย</th>
                        <th>เดือน</th>
                        <th>ออม/เดือน</th>
                        <th>ออม/วัน</th>
                    </tr>

                </thead>


                <tbody id="tableBody">

                    <tr>
                        <td
                            colspan="6"
                            class="loading"
                        >
                            กำลังโหลดข้อมูล...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- ================================================= -->
<!-- Supabase JavaScript Library -->
<!-- ================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- ================================================= -->
<!-- Application JavaScript -->
<!-- ================================================= -->

<script src="app.js"></script>

</body>
</html>
